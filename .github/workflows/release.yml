name: release

# On a tag, checks that the committed databases still match a rebuild from source,
# then publishes those committed databases and their manifests as release assets.
# The databases stay committed in the repository as well, so existing download
# links keep working. A scheme whose README gives its Status as draft stops the
# release, so only verified schemes are published.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The full history: each database records the last commit that changed
      # its sources, which build.py looks up to compare it with a rebuild.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CanSNPer2
        run: |
          python -m pip install --upgrade pip
          # set back to master when 2.3.0 is released
          python -m pip install git+https://github.com/FOI-Bioinformatics/CanSNPer2.git@dev_2.3.0

      - name: Validate scheme sources
        run: python validate.py --require-verified

      - name: Check the SNP bases against the reference genomes
        run: python check_bases.py

      - name: Rebuild every scheme and compare with the committed databases
        run: python build.py

      - name: Publish the databases and manifests
        uses: softprops/action-gh-release@v2
        with:
          files: |
            database/*.db
            database/*.manifest.json
          fail_on_unmatched_files: true
