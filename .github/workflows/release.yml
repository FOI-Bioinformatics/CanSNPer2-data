name: release

# On a tag, checks that the committed databases still match a rebuild from source,
# then publishes those committed databases and their manifests as release assets.
# The databases stay committed in the repository as well, so existing download
# links keep working. Work-in-progress schemes are not published.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CanSNPer2
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/FOI-Bioinformatics/CanSNPer2.git@master

      - name: Validate scheme sources
        run: python validate.py

      - name: Rebuild every scheme and compare with the committed databases
        run: python build.py

      - name: Publish the databases and manifests
        uses: softprops/action-gh-release@v2
        with:
          files: |
            database/*.db
            database/*.manifest.json
          fail_on_unmatched_files: true
