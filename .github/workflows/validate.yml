name: validate

# Checks that the scheme sources are well formed and that every committed
# database still matches the sources beside it. progressiveMauve is not needed:
# it is only used when typing a sample, never when building a database.
# Schemes marked wip in schemes.toml, which need flextaxd to build, are
# validated but not built.

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  schemes:
    runs-on: ubuntu-latest
    steps:
      # The full history: each database records the last commit that changed
      # its sources, which build.py looks up to compare it with a rebuild.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CanSNPer2 and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/FOI-Bioinformatics/CanSNPer2.git@master
          python -m pip install pytest

      - name: Test the validation and build tools
        run: python -m pytest tests

      - name: Validate scheme sources
        run: python validate.py

      # The genomes are fetched from NCBI once per change of a references file.
      - name: Cache the reference genomes
        uses: actions/cache@v4
        with:
          path: .references
          key: references-${{ hashFiles('schemes/**/*_references.txt') }}

      - name: Check the SNP bases against the reference genomes
        run: python check_bases.py

      # master holds verified schemes only, so a scheme whose README gives its
      # Status as draft fails on a pull request into master or a push to it.
      - name: Require verified schemes on master
        if: github.base_ref == 'master' || (github.event_name == 'push' && github.ref_name == 'master')
        run: python validate.py --require-verified

      - name: Rebuild every scheme and compare with the committed databases
        run: python build.py
