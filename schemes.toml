# Scheme declarations for CanSNPer2-data.
#
# SNP schemes are discovered by convention and need no entry here: a file named
# schemes/<name>/<name>_snp.txt declares the scheme <name>, and its tree and
# reference files are inferred as <name>_tree.txt and <name>_references.txt in
# the same folder.
#
# An entry is only needed to declare a scheme of another kind, or to override a
# default. Recognised keys:
#
#   kind      "snp" (default) or "taxonomy"
#   tree      path to the tree file
#   snp       path to the SNP annotation file   (snp schemes)
#   genomes   path to the genome-to-node file   (<name>_genomes.txt in its
#             folder by default; required for taxonomy schemes, optional for snp)
#   snp_set   path to the ranked canSNPs of each node (snp schemes; the
#             optional <name>_canSNPs.txt in its folder by default)
#   verify    compare a rebuild against the committed database (default true)
#   source_type  tree reader to use (default "CanSNPer")
#   wip       validated, but built only when named with --scheme or when
#             --include-wip is given, for a scheme whose build needs tools that
#             continuous integration does not install (default false)
#   database_dir  directory holding the database and manifest (default "database")
#   readme    path to the README of the scheme (README.md in its folder by default)

[francisellaceae]
kind = "taxonomy"
# Built with flextaxd, which continuous integration does not install.
wip = true
# No database has ever been published for this scheme, so there is no baseline
# to compare a rebuild against. Builds are reported rather than verified.
verify = false

[yersinia_pestis]
# Published with "/" in the derived_base column, so CanSNPer2 can never call
# them derived; schemes/yersinia_pestis/README.md describes the effect. Listing
# them keeps the base check strict for every other SNP.
known_issues = ["1.ANT2.b", "1.ORI2.c", "1.ORI3.b"]
